<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excel Formula Challenge</title>
<style>
:root{--bg:#f3f7f1;--ink:#17301f;--card:#fff;--line:#c9d8c8;--green:#1d6f42;--yellow:#fff3b0;--bad:#b3261e;--badbg:#fde8e6;--okbg:#e3f5e8;--grid:#1d6f42;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--ink:#e8f3ea;--card:#17261c;--line:#2d4535;--green:#4cc27f;--yellow:#5a4d12;--bad:#ff8a80;--badbg:#3a1c1a;--okbg:#17372353;--grid:#4cc27f}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:16px;max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:1.25rem;margin:0}
#score{font-weight:700;color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.q{font-weight:700;font-size:1.05rem;margin:0 0 4px}
.hint{margin:0;opacity:.75;font-size:.92rem}
.wrap{overflow-x:auto;border:2px solid var(--grid);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:300px}
th,td{border:1px solid var(--line);padding:9px 10px;text-align:left}
th{background:var(--grid);color:#fff;text-align:center;font-weight:600}
td.rn{width:34px;text-align:center;background:var(--bg);opacity:.8}
td.ans{background:var(--yellow);font-weight:700}
input{width:100%;font:inherit;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.row{display:flex;gap:10px;margin:10px 0}
button{font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;border:0;cursor:pointer}
#check{background:var(--green);color:#fff;flex:1}
#next{background:var(--card);color:var(--ink);border:2px solid var(--line)}
#msg{padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
#msg.ok{background:var(--okbg);border-color:var(--green)}
#msg.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
#share{background:var(--card);color:var(--ink);border:2px solid var(--line);width:100%}
</style>
 <meta property="og:title" content="Excel Formula Challenge - Interactive Quiz" />
<meta property="og:description" content="Can you solve these Excel formulas? Test your XLOOKUP, SUMIF, and MAX skills now!" />
<meta property="og:url" content="https://rameshaithaa-spec.github.io/excel-challenge/formula-challenge.html" />
<meta property="og:type" content="website" />
 <meta property="og:image" content="https://rameshaithaa-spec.github.io/excel-challenge/preview.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="fb:app_id" content="1125625813753952"/>
 
</head>
<body>
<header><h1>🧩 Excel Formula Challenge</h1><span id="score">Score: 0</span></header>
<div class="card"><p class="q" id="q"></p><p class="hint" id="h"></p></div>
<div class="wrap"><table id="t"></table></div>
<div style="margin-top:12px"><input id="f" placeholder="=XLOOKUP(…)" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Formula"></div>
<div class="row"><button id="check">Check formula</button><button id="next">Next</button></div>
<div id="msg">Type a formula, then tap Check formula.</div>
<div class="row"><button id="share">Share my score</button></div>
<script>
const people=[["Ravi",35000,"Sales"],["Sita",42000,"HR"],["Arun",38000,"Sales"],["Meena",47000,"HR"],["Kiran",51000,"IT"]];
const rows=people.map((p,i)=>[101+i,p[0],p[1],p[2]]);
const L=["A","B","C","D"];
// cell value helper
const cell=(ref)=>{const m=/^([A-D])(\d+)$/.exec(ref);if(!m)return null;const r=+m[2]-2;if(r<0||r>=rows.length)return null;return rows[r][L.indexOf(m[1])]};
function rng(s){const m=/^([A-D])(\d+):([A-D])(\d+)$/i.exec(s.trim().toUpperCase());if(!m||m[1]!==m[3])return null;const out=[];for(let r=+m[2];r<=+m[4];r++)out.push(cell(m[1]+r));return out}
function num(s){s=s.trim();return s!==""&&!isNaN(s)?+s:s.replace(/^"|"$/g,"")}
function splitArgs(s){const a=[];let d=0,cur="";for(const c of s){if(c==="(")d++;if(c===")")d--;if(c===","&&d===0){a.push(cur);cur=""}else cur+=c}a.push(cur);return a}
function evalF(f){
 f=f.trim();if(!f.startsWith("="))throw"Formulas start with =";
 const m=/^=([A-Z.]+)\((.*)\)$/i.exec(f);if(!m)throw"Use a function like =SUM(C2:C6)";
 const fn=m[1].toUpperCase(),a=splitArgs(m[2]);
 if(fn==="XLOOKUP"||fn==="VLOOKUP"&&false){
  if(a.length<3)throw"XLOOKUP needs lookup value, lookup range, return range";
  const k=num(a[0]),lr=rng(a[1]),rr=rng(a[2]);if(!lr||!rr)throw"Check your ranges (e.g. A2:A6)";
  const i=lr.findIndex(v=>String(v).toLowerCase()===String(k).toLowerCase());return i<0?"#N/A":rr[i]}
 if(fn==="VLOOKUP"){
  if(a.length<3)throw"VLOOKUP needs value, table, column number";
  const k=num(a[0]);const t=/^([A-D])(\d+):([A-D])(\d+)$/i.exec(a[1].trim().toUpperCase());if(!t)throw"Check your table range";
  const c=+a[2];const c0=L.indexOf(t[1]);const r=rows.find(x=>String(x[c0]).toLowerCase()===String(k).toLowerCase());
  return r?r[c0+c-1]:"#N/A"}
 const r=rng(a[0]||"");
 if(["SUM","AVERAGE","MAX","MIN","COUNT"].includes(fn)){if(!r)throw"Check your range (e.g. C2:C6)";
  const n=r.filter(v=>typeof v==="number");
  return fn==="SUM"?n.reduce((x,y)=>x+y,0):fn==="AVERAGE"?n.reduce((x,y)=>x+y,0)/n.length:fn==="MAX"?Math.max(...n):fn==="MIN"?Math.min(...n):n.length}
 if(fn==="SUMIF"){const cr=rng(a[0]),sr=rng(a[2]);if(!cr||!sr)throw"Check your ranges";const k=num(a[1]);
  return cr.reduce((s,v,i)=>s+(String(v).toLowerCase()===String(k).toLowerCase()?sr[i]:0),0)}
 if(fn==="COUNTIF"){const cr=rng(a[0]);if(!cr)throw"Check your range";const k=num(a[1]);return cr.filter(v=>String(v).toLowerCase()===String(k).toLowerCase()).length}
 throw"Function "+fn+" isn't supported in this game"}
const Q=[
 {q:"Find the salary for employee ID 102.",h:"Try XLOOKUP.",a:42000},
 {q:"Find the total of all salaries.",h:"Try SUM.",a:people.reduce((s,p)=>s+p[1],0)},
 {q:"Find the highest salary.",h:"Try MAX.",a:51000},
 {q:"Find the average salary.",h:"Try AVERAGE.",a:(35000+42000+38000+47000+51000)/5},
 {q:"Find the total salary of the Sales team (column D).",h:"Try SUMIF.",a:73000},
 {q:"How many people work in HR?",h:"Try COUNTIF.",a:2},
 {q:"Find the employee name for ID 104.",h:"Try XLOOKUP with the name column B.",a:"Meena"}
];
let i=0,score=0,solved=false;
const $=id=>document.getElementById(id);
function draw(){
 const head="<tr><th></th>"+L.map(l=>"<th>"+l+"</th>").join("")+"</tr>";
 const hdr=["ID","Employee","Salary","Team"];
 let h=head+"<tr><td class='rn'>1</td>"+hdr.map(x=>"<td><b>"+x+"</b></td>").join("")+"</tr>";
 rows.forEach((r,k)=>h+="<tr><td class='rn'>"+(k+2)+"</td>"+r.map(x=>"<td>"+x+"</td>").join("")+"</tr>");
 h+="<tr><td class='rn'>"+(rows.length+2)+"</td><td><b>Answer</b></td><td colspan='3' class='ans' id='res'>← formula result</td></tr>";
 $("t").innerHTML=h;$("q").textContent=Q[i].q;$("h").textContent=Q[i].h+" Your answer goes in the yellow cell.";
 $("f").value="";solved=false;msg("Type a formula, then tap Check formula.","")}
function msg(t,c){const m=$("msg");m.textContent=t;m.className=c}
$("check").onclick=()=>{
 const f=$("f").value;if(!f.trim())return msg("Enter a formula first.","no");
 try{const v=evalF(f);$("res").textContent=v;
  if(String(v)===String(Q[i].a)){if(!solved){score+=10;solved=true;$("score").textContent="Score: "+score}msg("Correct! Result: "+v+(i<Q.length-1?" Tap Next.":" You finished all challenges!"),"ok")}
  else msg(v==="#N/A"?"#N/A: that value wasn't found. Check your lookup value and ranges.":"Result is "+v+", not the answer. Check the question and try again.","no")}
 catch(e){msg(String(e),"no")}};
$("next").onclick=()=>{i=(i+1)%Q.length;draw()};
$("f").addEventListener("keydown",e=>{if(e.key==="Enter")$("check").click()});
$("share").onclick=async()=>{
 const t="I scored "+score+" on the Excel Formula Challenge! Can you beat me?";
 try{if(navigator.share){await navigator.share({title:"Excel Formula Challenge",text:t,url:location.href})}
 else{await navigator.clipboard.writeText(t+" "+location.href);msg("Copied. Paste it into your Facebook post.","ok")}}catch(e){msg("Copy this: "+t,"")}};
draw();
</script>
</body>
</html>
